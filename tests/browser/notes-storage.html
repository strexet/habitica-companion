<!doctype html><meta charset="utf-8"><title>Disposable Notes storage qualification</title>
<style>body{font:18px system-ui;margin:2rem;max-width:60rem}button{font:inherit;padding:1rem;margin:.5rem}pre{white-space:pre-wrap}</style>
<h1>Disposable Notes storage qualification</h1><p>Synthetic data on a dedicated localhost origin. No credentials, cloud upload or Habitica calls.</p>
<button id="seed">Seed old browser data</button><button id="run">Upgrade and check Notes</button><button id="reload">Verify after reload</button><button id="clear">Clear disposable Notes</button><pre id="result"></pre>
<script type="module">
import Dexie from '/vendor/dexie.mjs';const scope='a'.repeat(64),id='11111111-1111-4111-8111-111111111111',at='2026-10-23T00:00:00+00:00',body='# 🧥 Размер\r\n```md\nexact\n```\r\n';
const output=document.querySelector('#result');function check(value,label){output.textContent+=(value?'PASS ':'FAIL ')+label+'\n';if(!value)throw Error(label);}
function action(id,fn){document.querySelector(id).onclick=async()=>{try{await fn();}catch(e){output.textContent+='ERROR '+e.message+'\n';}};}
action('#seed',async()=>{const old=new Dexie('habitica-tool');old.version(1).stores({kv:'&key, updatedAtUtc'});await old.table('kv').put({key:'notes-upgrade-canary',jsonText:'preserved'});old.close();check(true,'version1 fixture seeded');});
action('#run',async()=>{const storage=await import('/js/storage/indexedDbStorage.js');check(await storage.getJson('notes-upgrade-canary')==='preserved','upgrade preserves old key/value data');check(await storage.getNotes(scope)===null,'old browser has no invented notes');
 const current={revision:1,title:'Личная заметка',markdown:body,isTrashed:false,atUtc:at};const receipt={commandId:'22222222-2222-4222-8222-222222222222',payloadHash:'b'.repeat(64),noteId:id,noteRevision:1,notebookRevision:1};
 const book={schemaVersion:1,ownerScope:scope,revision:1,notes:[{id,current,createdAtUtc:at,history:[]}],receipts:[receipt],purged:[]};check(await storage.commitNotes(scope,0,JSON.stringify(book)),'first Notes write accepted');
 const next={...book,revision:2,notes:[{...book.notes[0],current:{...current,revision:2,markdown:body+'尾'},history:[current]}],receipts:[receipt,{...receipt,commandId:'33333333-3333-4333-8333-333333333333',noteRevision:2,notebookRevision:2}]};
 const commits=await Promise.all([storage.commitNotes(scope,1,JSON.stringify(next)),storage.commitNotes(scope,1,JSON.stringify(next))]);check(commits.filter(Boolean).length===1,'concurrent Notes CAS accepts once');check(await storage.getNotes('c'.repeat(64))===null,'account scopes isolated');
 let rejected=false;try{await storage.commitNotes(scope,2,JSON.stringify({...next,revision:3,receipts:[{...receipt,payloadHash:'f'.repeat(64)},...next.receipts]}));}catch{rejected=true;}check(rejected,'accepted receipts immutable');});
action('#reload',async()=>{const storage=await import('/js/storage/indexedDbStorage.js');const book=JSON.parse(await storage.getNotes(scope));check(book.revision===2&&book.notes[0].current.markdown===body+'尾'&&book.notes[0].history[0].markdown===body,'exact Unicode CRLF and history survive reload');});
action('#clear',async()=>{const storage=await import('/js/storage/indexedDbStorage.js');await storage.clearNotes();check(await storage.getNotes(scope)===null,'explicit clear removes Notes');check(await storage.getJson('notes-upgrade-canary')==='preserved','Notes clear preserves unrelated data');});
</script>
