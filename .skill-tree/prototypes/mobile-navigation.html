<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Companion navigation prototype</title>
<style>
:root{font-family:system-ui,sans-serif;color:#233d38;background:#f7f6ef;font-size:16px;--line:#cad3cc;--muted:#53665e;--accent:#246655;--paper:#fffef8;--soft:#e5efe4}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button,a{min-height:44px}button{border:1px solid var(--line);border-radius:12px;background:var(--paper);color:inherit;padding:10px 14px}button:disabled{cursor:default;background:#e4e8e3;color:#52625b}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #98680d;outline-offset:3px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.quiet{background:transparent}.muted{color:var(--muted)}.small{font-size:.85rem}.badge{border-radius:20px;background:var(--soft);padding:4px 10px;display:inline-block;font-size:.8rem}.skip{position:absolute;top:-100px;background:white}.skip:focus{top:0;z-index:9}header{padding:16px max(16px,env(safe-area-inset-right)) 10px;display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header p{margin:3px 0;line-height:1.5}header strong{font-size:1.15rem}.layout{max-width:1120px;margin:auto}main{padding:20px 16px calc(var(--nav-height,74px) + 110px);min-width:0}h1{font-size:1.65rem;margin:6px 0 4px}h2{font-size:1.1rem;margin:24px 0 10px}p{line-height:1.5}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px}.heading button{flex-shrink:0}.notice{border-left:3px solid var(--accent);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}.row .body{flex:1;min-width:0}.row .body button{text-align:left;padding:3px 0;background:none;border:0;border-radius:0;width:100%;overflow-wrap:anywhere}.row .body small{display:block;line-height:1.4;color:var(--muted);overflow-wrap:anywhere}.check{width:44px;min-width:44px;padding:4px;border-radius:50%;font-size:1.2rem}.completed .body{text-decoration:line-through}.grid{display:grid;gap:12px}.tile{padding:16px;text-align:left;display:block;border:1px solid var(--line);border-radius:14px;background:var(--paper);width:100%;overflow-wrap:anywhere}.tile strong{display:block}.tile span{display:block;color:var(--muted);margin-top:5px;line-height:1.4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs [aria-pressed=true]{background:var(--accent);color:white}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar>*{flex:1;min-width:0}input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:9px;background:white;color:inherit;padding:10px;margin:5px 0 14px}textarea{min-height:90px}label{display:block;font-weight:600}label small{font-weight:400}nav{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px max(8px,env(safe-area-inset-bottom));z-index:3}nav button{border:0;background:transparent;border-radius:10px;padding:8px 2px;font-size:.8rem;min-height:54px;overflow-wrap:anywhere}nav button[aria-current=page]{background:var(--soft);font-weight:700}nav span{display:block;font-size:1.05rem;margin-bottom:3px}.capture{position:fixed;bottom:calc(var(--nav-height,74px) + 16px);right:16px;z-index:2;box-shadow:0 3px 10px #233d3822}dialog{border:1px solid var(--line);border-radius:20px 20px 0 0;position:fixed;margin:0;top:auto;bottom:0;width:100%;max-width:none;max-height:90dvh;padding:20px max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom));overflow-y:auto;background:var(--paper);color:inherit}dialog::backdrop{background:#142b2466}dialog h2{margin-top:0}dialog .heading{margin-bottom:18px}details{margin:8px 0 18px}summary{padding:12px 0;cursor:pointer;min-height:44px}#feedback{position:fixed;z-index:5;bottom:calc(var(--nav-height,74px) + 80px);left:16px;right:16px;background:#233d38;color:white;padding:12px;border-radius:10px;max-width:600px;margin:auto;display:none;line-height:1.5}#feedback:not(:empty){display:block}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:12px 0}.calendar button{padding:5px;min-width:0;min-height:44px}.calendar button[aria-pressed=true]{background:var(--accent);color:white}.calendar .weekday{padding:6px 0;text-align:center;font-size:.75rem}.day-dot{font-size:.7rem;display:block}.count{color:var(--muted);font-size:.9rem}.top-link{font-size:.85rem;color:var(--accent)}progress{width:100%;accent-color:var(--accent)}
@media(min-width:768px){.layout{display:grid;grid-template-columns:200px minmax(0,1fr)}header{padding:20px max(24px,calc((100% - 1080px)/2))}nav{position:sticky;grid-column:1;grid-row:1;top:16px;bottom:auto;border:0;background:transparent;display:flex;flex-direction:column;padding:24px 12px;align-self:start}nav button{text-align:left;padding:10px 16px;font-size:1rem}nav span{display:inline-block;width:25px}main{grid-column:2;padding:24px 24px 120px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.capture{bottom:30px;right:max(30px,calc((100% - 1080px)/2))}dialog{max-width:600px;bottom:auto;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:20px;max-height:85dvh;padding:24px}#feedback{bottom:30px;right:auto;left:220px;max-width:480px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
<a class="skip" href="#content">Skip to tasks</a>
<header><div><strong>Habitica Companion</strong><p class="muted small">Design prototype · synthetic tasks only</p></div><span class="badge">Local demo</span></header>
<div class="layout"><nav aria-label="Main navigation"></nav><main id="content" tabindex="-1"></main></div>
<button class="capture primary" id="capture">＋ Add task</button>
<div id="feedback" role="status" aria-live="polite"></div>
<dialog id="editor" aria-labelledby="editor-title"><form id="task-form" method="dialog"><div class="heading"><h2 id="editor-title">Add task</h2><button type="button" id="close" aria-label="Close task editor">✕</button></div>
<div id="fields"><label for="task-name">Task name</label><input id="task-name" maxlength="2048" required autocomplete="off" placeholder="What needs doing?">
<details id="advanced"><summary>More options</summary><label for="task-kind">Type</label><select id="task-kind"><option>Todo</option><option>Daily</option><option>Habit</option></select><label for="task-plan">Plan for <small>— optional</small></label><input type="date" id="task-plan"><label for="task-deadline">Deadline <small>— optional, separate from plan</small></label><input type="date" id="task-deadline"><label for="task-project">Project</label><select id="task-project"><option value="">No project</option><option>Home refresh</option><option>Learn Spanish</option></select><label for="task-notes">Notes</label><textarea id="task-notes"></textarea></details>
<div class="bar"><button type="submit" class="primary" id="review">Review task</button><button type="button" id="archive" hidden>Archive</button></div></div>
<div id="preview" hidden><p id="preview-text"></p><p class="notice">Save in Companion only. No Habitica changes or rewards.</p><div class="bar"><button type="button" class="primary" id="save">Save task</button><button type="button" id="back">Keep editing</button></div></div></form></dialog>
<script>
const today='2026-10-17';let page='Today',planView='Upcoming',selectedDate=today,editing=null,draft=null,filter='',feedbackTimer,habitScore=0;
const tasks=[{id:1,text:'Choose paint samples for the living room',project:'Home refresh',plan:today,deadline:'2026-10-20',kind:'Todo',notes:'Compare two warm neutral shades.',done:false},{id:2,text:'Read ten pages',plan:today,kind:'Daily',notes:'One occurrence for today.',done:false},{id:3,text:'Book an eye check',kind:'Todo',notes:'Captured for later review.',done:false},{id:4,text:'Review the first Spanish lesson',project:'Learn Spanish',plan:'2026-10-18',kind:'Todo',done:false},{id:5,text:'Long task title for accessibility and wrapping: prepare a packing checklist for an extended family trip with several connecting trains',plan:today,kind:'Todo',done:false},{id:6,text:'Order replacement desk lamp',kind:'Todo',done:true},{id:7,text:'Drink water',kind:'Habit',done:false}];
const main=document.querySelector('main'),dialog=document.querySelector('dialog'),nav=document.querySelector('nav');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function announce(text){document.querySelector('#feedback').textContent=text;clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>document.querySelector('#feedback').textContent='',6000)}
const dateLabel=d=>d===today?'Today':d==='2026-10-18'?'Tomorrow':d||'No date';
function row(t){return `<div class="row ${t.done?'completed':''}"><button class="check" data-complete="${t.id}" aria-label="${t.done?'Restore':'Complete'} ${escape(t.text)}">${t.done?'✓':'○'}</button><div class="body"><button data-edit="${t.id}">${escape(t.text)}</button><small>${escape([t.kind,t.project,t.plan&&'Planned '+dateLabel(t.plan),t.deadline&&'Deadline '+t.deadline].filter(Boolean).join(' · '))}</small><small>Saved in Companion · no game effect</small></div></div>`}
const list=items=>items.length?items.map(row).join(''):'<p class="notice">Nothing here. Add a task whenever needed.</p>';
function render(){nav.innerHTML=['Today','Inbox','Plan','Projects','More'].map((name,i)=>`<button ${name===page?'aria-current="page"':''} data-page="${name}"><span aria-hidden="true">${['◉','▣','▦','◇','☰'][i]}</span>${name}</button>`).join('');
let body='';const active=tasks.filter(t=>!t.done&&!t.archived);
if(page==='Today'){body=`<p class="muted">Saturday, 17 October</p><h2>Planned for today</h2>${list(active.filter(t=>t.plan===today&&t.kind!=='Habit'))}<h2>Habits</h2><div class="row"><div class="body"><strong>Drink water</strong><small>Today: ${habitScore} · Companion-only history</small></div><button id="habit-up" aria-label="Record positive Drink water event">＋</button><button id="habit-down" aria-label="Record negative Drink water event">−</button></div>`}
if(page==='Inbox')body=`<p class="muted">Capture now. Organize when ready.</p>${list(active.filter(t=>!t.project&&!t.plan&&t.kind==='Todo'))}`;
if(page==='Plan'){body=`<div class="tabs">${['Upcoming','Week','Month'].map(name=>`<button data-plan="${name}" aria-pressed="${planView===name}">${name}</button>`).join('')}</div><p class="muted">Plan dates and deadlines remain separate.</p>`;if(planView!=='Upcoming'){body+=`<h2>October 2026</h2><div class="calendar">${['M','T','W','T','F','S','S'].map(d=>`<span class="weekday">${d}</span>`).join('')}${planView==='Month'?'<span></span><span></span><span></span>':''}${Array.from({length:planView==='Week'?7:31},(_,i)=>{const day=planView==='Week'?12+i:i+1,d='2026-10-'+String(day).padStart(2,'0');return `<button data-day="${d}" aria-pressed="${d===selectedDate}" aria-label="October ${day}">${day}${active.some(t=>t.plan===d)?'<span class="day-dot" aria-hidden="true">•</span>':''}</button>`}).join('')}</div><h2>Agenda · ${dateLabel(selectedDate)}</h2>${list(active.filter(t=>t.plan===selectedDate))}`;}else body+=`<h2>Today</h2>${list(active.filter(t=>t.plan===today))}<h2>Tomorrow</h2>${list(active.filter(t=>t.plan==='2026-10-18'))}<h2>Anytime</h2>${list(active.filter(t=>!t.plan&&t.kind==='Todo'))}`;}
if(page==='Projects')body=`<p class="muted">Optional structure for personal work.</p><div class="grid">${['Home refresh','Learn Spanish'].map(name=>{let all=tasks.filter(t=>t.project===name&&!t.archived),done=all.filter(t=>t.done).length;return `<button class="tile" data-project="${name}"><strong>${name}</strong><span>${done} of ${all.length} Todos complete</span><progress value="${done}" max="${Math.max(1,all.length)}" aria-label="${name} progress"></progress></button>`}).join('')}</div><h2>All project tasks</h2>${list(active.filter(t=>t.project))}`;
if(page==='More')body=`<p class="muted">Tasks, game features and account controls.</p><div class="grid">${['Habits & Dailies','Completed & activity','Search & saved views','Dashboard','Spells','Equipment','Pets & Mounts','Party · read only','Quests · read only','Connections & backups','Settings','Diagnostics'].map(name=>`<button class="tile" data-hub="${name}"><strong>${name}</strong><span>${name.includes('read only')?'Shared actions unavailable':name==='Connections & backups'?'Manage Codex / ChatGPT linking and separate cloud consent':'Open section'}</span></button>`).join('')}</div>`;
if(page==='Completed')body=`<p class="muted">Retained Companion history, independent of Habitica.</p>${list(tasks.filter(t=>t.done&&!t.archived))}`;
if(page==='Search')body=`<label for="search">Search tasks and notes</label><input id="search" value="${escape(filter)}" placeholder="Find a task"><details><summary>Filters</summary><p>Project, label, priority, state, dates and game sync status.</p></details>${list(tasks.filter(t=>!t.archived&&(t.text+' '+(t.notes??'')).toLowerCase().includes(filter.toLowerCase())))}`;
if(page==='Project')body=`<p class="muted">Home / personal projects</p>${list(active.filter(t=>t.project===window.selectedProject))}<button id="project-add">Add task to project</button>`;
main.innerHTML=`<div class="heading"><h1>${escape(page==='Project'?window.selectedProject:page)}</h1>${page==='Completed'||page==='Search'||page==='Project'?'<button id="return">Back</button>':''}</div>${body}`;
main.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let t=tasks.find(x=>x.id===Number(b.dataset.complete));t.done=!t.done;announce(t.done?'Completed in the local demo. Open Completed & activity to restore.':'Restored in the local demo. No game action.');render()});main.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(tasks.find(x=>x.id===Number(b.dataset.edit))));main.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{planView=b.dataset.plan;render()});main.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.day;render()});main.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{window.selectedProject=b.dataset.project;page='Project';render()});main.querySelectorAll('[data-hub]').forEach(b=>b.onclick=()=>{if(b.dataset.hub==='Completed & activity'){page='Completed';render()}else if(b.dataset.hub==='Search & saved views'){page='Search';render()}else announce(b.dataset.hub+' is a navigation destination in this prototype. No account or external service is connected.')});
if(document.querySelector('#return'))document.querySelector('#return').onclick=()=>{page=page==='Project'?'Projects':'More';render()};if(document.querySelector('#search'))document.querySelector('#search').onchange=e=>{filter=e.target.value;render()};if(document.querySelector('#project-add'))document.querySelector('#project-add').onclick=()=>openEditor(null,window.selectedProject);
for(const id of ['habit-up','habit-down'])if(document.getElementById(id))document.getElementById(id).onclick=()=>{habitScore+=id==='habit-up'?1:-1;render();announce('Local demo event recorded. Habitica score is not requested.')};}
nav.onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render();main.focus();window.scrollTo(0,0)};
function openEditor(task=null,project=''){editing=task;draft=null;document.querySelector('#editor-title').textContent=task?'Edit task':'Add task';document.querySelector('#task-name').value=task?.text??'';document.querySelector('#task-kind').value=task?.kind??'Todo';document.querySelector('#task-plan').value=task?.plan??'';document.querySelector('#task-deadline').value=task?.deadline??'';document.querySelector('#task-project').value=task?.project??project;document.querySelector('#task-notes').value=task?.notes??'';document.querySelector('#advanced').open=Boolean(task);document.querySelector('#fields').hidden=false;document.querySelector('#preview').hidden=true;document.querySelector('#archive').hidden=!task;dialog.showModal();document.querySelector('#task-name').focus()}
document.querySelector('#capture').onclick=()=>openEditor();document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#back').onclick=()=>{document.querySelector('#fields').hidden=false;document.querySelector('#preview').hidden=true};
document.querySelector('#task-form').onsubmit=e=>{e.preventDefault();draft={id:editing?.id??Math.max(...tasks.map(t=>t.id))+1,text:document.querySelector('#task-name').value.trim(),kind:document.querySelector('#task-kind').value,plan:document.querySelector('#task-plan').value,deadline:document.querySelector('#task-deadline').value,project:document.querySelector('#task-project').value,notes:document.querySelector('#task-notes').value,done:editing?.done??false};if(!draft.text)return;document.querySelector('#preview-text').textContent=draft.text+(draft.plan?' · Planned '+dateLabel(draft.plan):'')+(draft.deadline?' · Deadline '+draft.deadline:'');document.querySelector('#fields').hidden=true;document.querySelector('#preview').hidden=false;document.querySelector('#save').focus()};
document.querySelector('#save').onclick=()=>{if(editing)Object.assign(editing,draft);else tasks.push(draft);dialog.close();announce(!draft.plan&&!draft.project?'Saved to Inbox in the local demo. No Habitica action.':'Saved in the local demo. No Habitica action.');render()};document.querySelector('#archive').onclick=()=>{if(editing&&confirm('Archive this demo task? History is retained.')){editing.archived=true;dialog.close();announce('Archived in the local demo.');render()}};
new ResizeObserver(()=>document.documentElement.style.setProperty('--nav-height',nav.offsetHeight+'px')).observe(nav);
render();
</script></html>
