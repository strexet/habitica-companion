<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion design review</title>
<style>body{font:16px system-ui;background:#e1e4df;color:#233d38;margin:0;padding:12px}header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}label{display:flex;align-items:center;gap:8px}button,select{font:inherit;padding:10px;border:1px solid #87998b;border-radius:8px;background:#fffef8;color:inherit;min-height:44px}iframe{display:block;margin:auto;border:1px solid #87998b;border-radius:12px;max-width:100%;background:#f7f6ef}p{line-height:1.4;font-size:14px;max-width:750px;margin:0}</style>
<header><strong>Navigation design review</strong><label>Viewport <select id="width"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="430">430 px</option><option value="768">Tablet · 768 px</option><option value="1024">Desktop · 1024 px</option></select></label><label><input type="checkbox" id="large">Large text · 200%</label><label><input type="checkbox" id="short">Short screen · keyboard approximation</label><button id="reset">Reset demo</button><button id="measure">Check layout</button><output id="measurements" aria-live="polite"></output><p>Only synthetic tasks in a local prototype. Capture, edit, plan, complete and restore demo tasks. No account or external service is connected.</p></header>
<iframe src="mobile-navigation.html" width="390" height="760" title="Companion navigation prototype"></iframe>
<script>
const frame=document.querySelector('iframe');function apply(){frame.width=document.querySelector('#width').value;frame.height=document.querySelector('#short').checked?460:760;frame.contentDocument.documentElement.style.fontSize=document.querySelector('#large').checked?'32px':'16px';frame.width=Number(document.querySelector('#width').value)+Math.max(0,frame.clientWidth-frame.contentDocument.documentElement.clientWidth)};frame.onload=apply;for(const id of ['width','large','short'])document.getElementById(id).onchange=apply;document.getElementById('reset').onclick=()=>frame.src='mobile-navigation.html';
document.getElementById('measure').onclick=()=>{const d=frame.contentDocument,w=d.defaultView,n=d.querySelector('nav'),c=d.querySelector('#capture'),visible=Array.from(d.querySelectorAll('button,input,select,summary')).filter(e=>e.getClientRects().length&&!e.closest('[hidden]')),small=visible.filter(e=>e.getBoundingClientRect().height<44),dialog=d.querySelector('dialog[open]'),focused=d.activeElement;document.querySelector('#measurements').textContent=JSON.stringify({viewport:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,height:frame.height,largeText:document.querySelector('#large').checked,smallTargetCount:small.length,captureClearOfNav:(()=>{const a=c.getBoundingClientRect(),b=n.getBoundingClientRect();return a.bottom<=b.top||a.top>=b.bottom||a.right<=b.left||a.left>=b.right})(),dialogOpen:Boolean(dialog),focused:focused?.id||focused?.tagName});};
</script></html>
