<!doctype html><title>Diagnostic Auth qualification</title><button id="run">Run Auth matrix</button><pre id="result">ready</pre><iframe id="frame" style="height:1000px;border:0"></iframe><script type="module">const result=document.querySelector('#result'),frame=document.querySelector('#frame');document.querySelector('#run').onclick=async()=>{let rows=[];for(const page of ['diagnostic-consent','diagnostic-identify'])for(const theme of ['light','dark'])for(const text of [100,200])for(const width of [360,390,768,1200]){frame.style.width=width+'px';let row=await new Promise(resolve=>{let timer=setTimeout(()=>{window.removeEventListener('message',handler);resolve({page,theme,text,width,error:'deadline'});},5000);function handler(e){if(e.source!==frame.contentWindow||e.origin!==location.origin)return;clearTimeout(timer);window.removeEventListener('message',handler);resolve({page,theme,text,width,...e.data});}window.addEventListener('message',handler);frame.src=`${page}-${theme}-${text}.html`;});rows.push(row);result.textContent=JSON.stringify({running:rows.length,rows});}result.textContent=JSON.stringify({complete:true,rows});};</script>
