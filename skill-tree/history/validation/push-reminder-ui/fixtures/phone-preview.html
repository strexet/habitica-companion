<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Push phone preview</title></head><body style="margin:12px;background:#ddd;font:16px sans-serif"><h1>Synthetic 390px phone, 200% text</h1><label>Screen <select id="screen"><option value="push-schedule-weekly">Repeat preview</option><option value="push-device-pending">Device recovery</option><option value="push-open-signin">Sign-in gate</option></select></label><label> Theme <select id="theme"><option>gryphy-light</option><option>obsidian-glow</option></select></label><iframe title="Phone preview" id="phone" style="display:block;width:390px;height:850px;margin-top:16px;border:1px solid black"></iframe><script>const screen=document.querySelector('#screen'),theme=document.querySelector('#theme'),phone=document.querySelector('#phone');function show(){phone.src=screen.value+'.html?text=200&theme='+theme.value;}screen.onchange=theme.onchange=show;show();</script></body></html>
